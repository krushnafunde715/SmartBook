<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartBook — Editorial Bookstore and Rule-Based Recommendation System">
    <title>{% block title %}SmartBook{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- SmartBook Editorial Stylesheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') if url_for else '/static/css/variables.css' }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') if url_for else '/static/css/style.css' }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') if url_for else '/static/css/auth.css' }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/alerts.css') if url_for else '/static/css/alerts.css' }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Global Alert & Confirmation System Components -->
    {% block alerts %}
    {% include 'components/alerts.html' %}
    {% endblock %}

    <!-- Main Content Slot -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Mobile Sidebar Backdrop -->
    <div class="sb-sidebar-backdrop" id="sbSidebarBackdrop"></div>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- SmartBook Centralized Alert & Notification Script -->
    <script src="{{ url_for('static', filename='js/alerts.js') if url_for else '/static/js/alerts.js' }}"></script>
    <!-- SmartBook Auth Script -->
    <script src="{{ url_for('static', filename='js/auth.js') if url_for else '/static/js/auth.js' }}"></script>
    <!-- SmartBook Responsive Navigation Script -->
    <script src="{{ url_for('static', filename='js/nav.js') if url_for else '/static/js/nav.js' }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
