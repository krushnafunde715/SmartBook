{% extends 'base.html' %}
{% set active_page = 'login' %}

{% block title %}Log In — SmartBook{% endblock %}

{% block alerts %}{% endblock %}

{% block content %}
<div class="sb-login-viewport">
    <!-- Smooth Ivory Gradient Overlay on Left Side -->
    <div class="sb-login-overlay"></div>

    <!-- Main Content Container (Left ~42% width) -->
    <div class="sb-login-content-wrapper">
        <div class="sb-login-card">
            <!-- SmartBook Logo (approx 360px wide) -->
            <a href="{{ url_for('main.index') if url_for else '/' }}" class="sb-login-logo-wrap" title="SmartBook">
                <img src="{{ url_for('static', filename='images/logo.svg') if url_for else '/static/images/logo.svg' }}"
                     alt="SmartBook Logo"
                     class="sb-login-logo">
            </a>

            <!-- Heading: Welcome Back (approx 68–76px) -->
            <h1 class="sb-login-heading">
                Welcome <span class="sb-login-heading-accent">Back</span>
            </h1>

            <!-- Terracotta Accent Line -->
            <div class="sb-login-accent-line"></div>

            {% include 'components/alerts.html' %}

            <!-- Login Form (500px width on 1440px desktop) -->
            <form action="{{ url_for('auth.login') if url_for else '/auth/login' }}" method="POST" class="sb-login-form" novalidate>
                <!-- Email Address -->
                <div class="mb-3">
                    <label for="email" class="form-label sb-login-label">Email address</label>
                    <input type="email"
                           class="form-control sb-login-input"
                           id="email"
                           name="email"
                           placeholder="name@example.com"
                           required
                           autocomplete="email">
                </div>

                <!-- Password with Visibility Toggle -->
                <div class="mb-3">
                    <label for="password" class="form-label sb-login-label">Password</label>
                    <div class="sb-password-wrap position-relative">
                        <input type="password"
                               class="form-control sb-login-input pe-5"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               required
                               autocomplete="current-password">
                        <button type="button" class="btn sb-password-toggle sb-toggle-password" data-target="password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password Row -->
                <div class="sb-login-options d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check m-0">
                        <input class="form-check-input sb-login-checkbox" type="checkbox" id="remember_me" name="remember_me">
                        <label class="form-check-label sb-login-check-label" for="remember_me">
                            Remember Me
                        </label>
                    </div>
                    <a href="#" class="sb-login-forgot-link" onclick="SmartAlert.info('A password reset link will be sent to your registered email address.', 'Password Reset'); return false;">
                        Forgot Password?
                    </a>
                </div>

                <!-- Large Primary Login Button (~68px high) -->
                <button type="submit" class="btn btn-login-primary mb-3">
                    <i class="bi bi-box-arrow-in-right fs-5"></i> Log In
                </button>

                <!-- Create Account Navigation -->
                <div class="sb-login-switch-text">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') if url_for else '/auth/register' }}" class="sb-login-switch-link">Create Account</a>
                </div>

                <!-- Back to Home Link -->
                <div class="sb-login-back-wrap">
                    <a href="{{ url_for('main.index') if url_for else '/' }}" class="sb-login-back-link">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
