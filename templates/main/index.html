{% extends 'base.html' %}
{% set active_page = 'home' %}

{% block title %}Welcome to SmartBook{% endblock %}

{% block content %}
<div class="sb-hero-viewport">
    <!-- Warm Vignette Blend Overlay -->
    <div class="sb-hero-overlay"></div>

    <!-- Main Content Grid / Card -->
    <div class="sb-hero-content-wrapper">
        <div class="sb-hero-card">
            <!-- SmartBook Branding -->
            <a href="{{ url_for('main.index') if url_for else '/' }}" class="sb-hero-logo-wrap" title="SmartBook">
                <img src="{{ url_for('static', filename='images/logo.svg') if url_for else '/static/images/logo.svg' }}"
                     alt="SmartBook Logo"
                     class="sb-hero-logo">
            </a>

            <!-- Welcome Heading -->
            <h1 class="sb-hero-heading">
                Welcome to
                <span class="sb-hero-brand-highlight">SmartBook</span>
            </h1>

            <!-- Terracotta Accent Line -->
            <div class="sb-hero-accent-line"></div>

            <!-- Action Area -->
            <div class="sb-hero-actions">
                <!-- Log In Button -->
                <a href="{{ url_for('auth.login') if url_for else '/auth/login' }}" class="btn btn-hero-login">
                    <i class="bi bi-box-arrow-in-right fs-5"></i> Log In
                </a>

                <!-- Switch Text -->
                <div class="sb-hero-switch-text">
                    Don't have an account?
                </div>

                <!-- Create Account Button -->
                <a href="{{ url_for('auth.register') if url_for else '/auth/register' }}" class="btn btn-hero-register">
                    <i class="bi bi-person-fill fs-5"></i> Create Account
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
